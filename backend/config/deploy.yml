service: email-screener-backend
image: <%= ENV.fetch("KAMAL_IMAGE", "ghcr.io/bandanapandey/email-screener-backend") %>

servers:
  web:
    - <%= ENV.fetch("KAMAL_WEB_HOST", "203.0.113.10") %>
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_JOB_HOST", ENV.fetch("KAMAL_WEB_HOST", "203.0.113.10")) %>
    cmd: bin/jobs

proxy:
  ssl: <%= ENV.fetch("KAMAL_PROXY_SSL", "true") == "true" %>
  host: <%= ENV.fetch("BACKEND_APP_HOST", "api.example.com") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "BandanaPandey") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - BACKEND_DATABASE_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
  clear:
    AI_PROVIDER: <%= ENV.fetch("AI_PROVIDER", "openai") %>
    ASSUME_SSL: <%= ENV.fetch("ASSUME_SSL", "true") %>
    BACKEND_ALLOWED_HOSTS: <%= ENV.fetch("BACKEND_ALLOWED_HOSTS", ENV.fetch("BACKEND_APP_HOST", "api.example.com")) %>
    BACKEND_APP_HOST: <%= ENV.fetch("BACKEND_APP_HOST", "api.example.com") %>
    BACKEND_APP_PROTOCOL: <%= ENV.fetch("BACKEND_APP_PROTOCOL", "https") %>
    FORCE_SSL: <%= ENV.fetch("FORCE_SSL", "true") %>
    FRONTEND_APP_ORIGINS: <%= ENV.fetch("FRONTEND_APP_ORIGINS", ENV.fetch("FRONTEND_APP_URL", "https://app.example.com")) %>
    FRONTEND_APP_URL: <%= ENV.fetch("FRONTEND_APP_URL", "https://app.example.com") %>
    RAILS_LOG_LEVEL: <%= ENV.fetch("RAILS_LOG_LEVEL", "info") %>
    SESSION_COOKIE_SAME_SITE: <%= ENV.fetch("SESSION_COOKIE_SAME_SITE", "none") %>
    SESSION_COOKIE_SECURE: <%= ENV.fetch("SESSION_COOKIE_SECURE", "true") %>
    SOLID_QUEUE_IN_PUMA: <%= ENV.fetch("SOLID_QUEUE_IN_PUMA", "false") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "email_screener_storage:/rails/storage"

builder:
  arch: amd64
